<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="#{register.pageTitle}">Hesap Oluştur - TaxiHub Stuttgart</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body>

<div class="auth-card">
    <div th:replace="~{fragments/header :: brand-header(#{register.subtitle})}"></div>

    <div class="auth-card__body">
        <h1 class="auth-card__title" th:text="#{register.title}">Hesap Oluştur</h1>

        <form th:action="@{/register}" th:object="${registerForm}" method="post">
            <div class="form-group">
                <label for="email" th:text="#{register.email}">İş E-postası</label>
                <input type="email" id="email" th:field="*{email}" th:placeholder="'ad.soyad@' + ${emailDomain}"/>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <label for="firstName" th:text="#{register.firstName}">Ad</label>
                <input type="text" id="firstName" th:field="*{firstName}"/>
            </div>

            <div class="form-group">
                <label for="lastName" th:text="#{register.lastName}">Soyad</label>
                <input type="text" id="lastName" th:field="*{lastName}"/>
            </div>

            <div class="form-group">
                <label for="password" th:text="#{register.password}">Şifre</label>
                <input type="password" id="password" th:field="*{password}"/>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

                <ul class="password-rules" id="passwordRules">
                    <li data-rule="length" th:text="#{register.passwordRule.length}">En az 8 karakter</li>
                    <li data-rule="uppercase" th:text="#{register.passwordRule.uppercase}">En az 1 büyük harf (A-Z)</li>
                    <li data-rule="digit" th:text="#{register.passwordRule.digit}">En az 1 rakam (0-9)</li>
                    <li data-rule="special" th:text="#{register.passwordRule.special}">En az 1 özel karakter (!@#$%^&* vb.)</li>
                </ul>
            </div>

            <div class="form-group">
                <label for="confirmPassword" th:text="#{register.confirmPassword}">Şifre (Tekrar)</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}"/>
                <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                <div class="field-error" id="matchMessage"></div>
            </div>

            <button type="submit" class="btn-primary" th:text="#{register.submit}">Kayıt Ol</button>
        </form>

        <div class="auth-links auth-links--center">
            <a th:href="@{/login}" th:text="#{register.haveAccount} + ' ' + #{register.login}">Zaten hesabınız var mı? Giriş yapın</a>
        </div>
    </div>
</div>

<script th:src="@{/js/password-validation.js}"></script>
<script>
    TaxiHubPasswordValidation.attach("password", "passwordRules");
    TaxiHubPasswordValidation.attachMatchCheck("password", "confirmPassword", "matchMessage");
</script>

</body>
</html>
