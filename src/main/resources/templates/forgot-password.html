<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="#{forgotPassword.pageTitle}">Şifremi Unuttum - TaxiHub Stuttgart</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body>

<div class="auth-card">
    <div th:replace="~{fragments/header :: brand-header(#{forgotPassword.subtitle})}"></div>

    <div class="auth-card__body">
        <h1 class="auth-card__title" th:text="#{forgotPassword.title}">Şifremi Unuttum</h1>

        <div class="alert alert-success" th:if="${successMessageKey}" th:text="#{__${successMessageKey}__}"></div>

        <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post">
            <div class="form-group">
                <label for="email" th:text="#{forgotPassword.email}">İş E-postası</label>
                <input type="email" id="email" th:field="*{email}" placeholder="ad.soyad@stuttgart-taxi.com"/>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <button type="submit" class="btn-primary" th:text="#{forgotPassword.submit}">Sıfırlama Linki Gönder</button>
        </form>

        <div class="auth-links auth-links--center">
            <a th:href="@{/login}" th:text="#{common.backToLogin}">Giriş sayfasına dön</a>
        </div>
    </div>
</div>

</body>
</html>
