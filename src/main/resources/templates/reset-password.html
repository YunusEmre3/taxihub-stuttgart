<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="#{resetPassword.pageTitle}">Yeni Şifre Belirle - TaxiHub Stuttgart</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body>

<div class="auth-card">
    <div th:replace="~{fragments/header :: brand-header(#{resetPassword.subtitle})}"></div>

    <div class="auth-card__body">

        <div th:if="${invalidToken}">
            <div class="alert alert-error" th:text="${errorMessage}"></div>
            <div class="auth-links auth-links--center">
                <a th:href="@{/forgot-password}" th:text="#{resetPassword.invalidTokenLink}">Yeni sıfırlama linki iste</a>
            </div>
        </div>

        <div th:unless="${invalidToken}">
            <h1 class="auth-card__title" th:text="#{resetPassword.title}">Yeni Şifre Belirle</h1>

            <form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post">
                <input type="hidden" th:field="*{token}"/>

                <div class="form-group">
                    <label for="password" th:text="#{resetPassword.newPassword}">Yeni Şifre</label>
                    <input type="password" id="password" th:field="*{password}"/>
                    <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

                    <ul class="password-rules" id="passwordRules">
                        <li data-rule="length" th:text="#{register.passwordRule.length}">En az 8 karakter</li>
                        <li data-rule="uppercase" th:text="#{register.passwordRule.uppercase}">En az 1 büyük harf (A-Z)</li>
                        <li data-rule="digit" th:text="#{register.passwordRule.digit}">En az 1 rakam (0-9)</li>
                        <li data-rule="special" th:text="#{register.passwordRule.special}">En az 1 özel karakter (!@#$%^&* vb.)</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" th:text="#{resetPassword.confirmPassword}">Yeni Şifre (Tekrar)</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}"/>
                    <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    <div class="field-error" id="matchMessage"></div>
                </div>

                <button type="submit" class="btn-primary" th:text="#{resetPassword.submit}">Şifreyi Güncelle</button>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/password-validation.js}"></script>
<script th:unless="${invalidToken}">
    TaxiHubPasswordValidation.attach("password", "passwordRules");
    TaxiHubPasswordValidation.attachMatchCheck("password", "confirmPassword", "matchMessage");
</script>

</body>
</html>
