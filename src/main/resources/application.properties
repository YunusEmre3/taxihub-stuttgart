spring.application.name=taxihub-stuttgart

# ==== Database ====
spring.datasource.url=jdbc:mysql://localhost:3306/taxihub_stuttgart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==== Company / business rules ====
company.email-domain=stuttgart-taxi.com

# ==== Resend (email API) ====
resend.api-key=${RESEND_API_KEY:}
resend.from-address=${RESEND_FROM_ADDRESS:TaxiHub Stuttgart <no-reply@stuttgart-taxi.com>}

# ==== App ====
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.reset-token-validity-minutes=30
app.verification-code-validity-minutes=10

# Origins allowed to call the two public endpoints cross-origin. Empty in the
# normal deployment, where the React site is built into this app's own static
# folder and every call is same-origin. Set it only when the frontend is hosted
# separately, e.g. CORS_ALLOWED_ORIGINS=https://your-app.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ==== Routing (OpenRouteService) ====
# api.openrouteservice.org is deprecated (returns 502) - api.heigit.org is the
# current working domain. Kept as a property (not hardcoded) so a future
# domain change is a one-line config edit, not a code change.
ors.base-url=https://api.heigit.org/openrouteservice
ors.api-key=${ORS_API_KEY:}

# Pricing (base fare / per-km) is no longer read from here - it's per
# VehicleType in the pricing_rules table, seeded once by PricingRuleSeeder
# and editable on the Settings page (System Configuration > Pricing Tariffs).

# ==== Public site contact info ====
# Taken from the real stuttgart-taxi.com contact details. whatsapp-number is
# digits-only (no +, spaces or leading 0 after country code) as required by
# the wa.me/<number> link format.
contact.phone=+49 711 99737797
contact.whatsapp-number=4971199737797
contact.email=info@stuttgart-taxi.com
contact.address=Karlsruher Strasse 11/1, 70771 Leinfelden-Echterdingen

# ==== Internationalization (TR/DE/EN) ====
# UTF-8 encoding is explicit here (not just relied on as a default) because
# the plain application.properties loader already bit us once this session
# with the German "ß" in contact.address decoding wrong under ISO-8859-1 -
# Spring's message bundle loader is a separate code path and needs its own
# explicit setting to avoid the same class of bug for German/Turkish text.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

server.port=8080
